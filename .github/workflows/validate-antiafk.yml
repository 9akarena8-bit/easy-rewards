name: Validate Anti-AFK and UI Patch
on:
  pull_request:
    paths:
      - '**/*.py'
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/validate-antiafk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt -r requirements-ui.txt pytest
      - name: Python syntax and tests
        run: |
          python -m compileall -q core.py backend.py webapp.py winio.py tests
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and browser tests
        run: |
          node --check ui/app.js
          node --check ui/gold_ui.js
          node --check ui/skinpay.js
          node --test tests/browser_controls.test.cjs tests/skinpay_ui.test.cjs
