name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**/*.py'
      - 'ui/**'
      - 'assets/**'
      - 'VERSION'
      - 'requirements*.txt'
      - 'BUILD_INSTALLER.bat'
      - 'EasyRewards.spec'
      - 'merchant_service/requirements-offline.txt'
      - 'installer.iss'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: easy-rewards-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version is consistent
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$v") { throw 'Tag and VERSION mismatch' }
          if (-not (Select-String -Path installer.iss -SimpleMatch ('#define AppVersion "' + $v + '"'))) { throw 'Inno Setup version mismatch' }
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Install dependencies and run regression tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-ui.txt -r merchant_service/requirements-offline.txt pytest 'pyinstaller>=6,<7'
          python -m compileall -q core.py backend.py webapp.py winio.py release_updater.py tests
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
          node --check ui/gold_ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Gold UI syntax failed' }
          node --test tests/browser_controls.test.cjs tests/skinpay_ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser control or SkinPay regression tests failed' }
          node --check ui/skinpay.js
          if ($LASTEXITCODE -ne 0) { throw 'SkinPay JavaScript syntax failed' }
      - name: Build EXE and installer
        shell: pwsh
        run: |
          if (!(Test-Path 'assets/license-public.pem')) { throw 'Public verification key missing' }
          python -m PyInstaller --noconfirm --clean EasyRewards.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7/ISCC.exe' }
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found on runner' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Compute SHA-256 for release installer
        shell: pwsh
        run: |
          Get-ChildItem 'release/*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path ($_.FullName + '.sha256') -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EasyRewards-Windows-Setup
          path: release/*
          if-no-files-found: error
      - name: Check if this version is already published
        id: publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag --repo '${{ github.repository }}' --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Keeping existing published files."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag not found. Publish after successful build."
          }
          # gh release view returns 1 when the tag is absent; this is expected.
          exit 0
      - name: Publish Stable GitHub Release automatically
        if: steps.publication.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.sha256
          generate_release_notes: true
          # All 1.4.x builds remain prereleases pending Fortnite acceptance.
          prerelease: ${{ startsWith(steps.version.outputs.tag, 'v1.4.') }}
          fail_on_unmatched_files: true
