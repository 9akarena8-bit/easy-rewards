name: Beta Windows Installer

# Development builds are for internal testing only. No tag and no public release.
on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easy-rewards-beta-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Test and build Windows beta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-ui.txt pytest 'pyinstaller>=6,<7'
      - name: Run regression tests
        shell: pwsh
        run: |
          python -m compileall -q core.py backend.py webapp.py i18n.py winio.py tests
          python -m pytest -q
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/app.js
          node --check ui/gold_ui.js
          node --test tests/browser_controls.test.cjs
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EasyRewards --icon 'assets/icon.ico' --add-data 'ui:ui' --add-data 'assets:assets' --add-data 'VERSION:.' --collect-submodules webview app.py
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7/ISCC.exe' }
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Upload beta installer (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: EasyRewards-v1.3.8-Beta-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
