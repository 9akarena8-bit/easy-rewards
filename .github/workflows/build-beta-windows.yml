name: Beta Windows Installer

# Development builds are for internal testing only. No tag and no public release.
on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
      - 'codex/integration-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easy-rewards-beta-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Test and build Windows beta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-ui.txt -r merchant_service/requirements-offline.txt pytest 'pyinstaller>=6,<7'
      - name: Run regression tests
        shell: pwsh
        run: |
          python -m compileall -q core.py backend.py webapp.py i18n.py winio.py tests
          python -m pytest -q
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/app.js
          node --check ui/gold_ui.js
          node --check ui/skinpay.js
          node --test tests/browser_controls.test.cjs tests/skinpay_ui.test.cjs
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean EasyRewards.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7/ISCC.exe' }
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Record installer checksums and source commit
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*.exe' -File)
          if (!$installers.Count) { throw 'Beta installer not found' }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          }
          git rev-parse HEAD | Set-Content -LiteralPath release/source-commit.txt -Encoding ascii
      - name: Upload beta installer (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: Fortnite-Pirate-Token-Beta-${{ github.sha }}
          path: |
            release/*.exe
            release/*.exe.sha256
            release/source-commit.txt
          if-no-files-found: error
          retention-days: 7
